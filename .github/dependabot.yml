version: 2
updates:
  - package-ecosystem: uv
    directory: /
    target-branch: develop
    commit-message:
      prefix: "chore(deps)"  # Conventional Commits [R19]
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    commit-message:
      prefix: "chore(deps)"  # Conventional Commits [R19]
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
